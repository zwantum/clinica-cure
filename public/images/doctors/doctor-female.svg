<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradFem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF7F5" />
      <stop offset="100%" stop-color="#D2F2EC" />
    </linearGradient>
    <linearGradient id="skinGradFem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCE1CE" />
      <stop offset="100%" stop-color="#F0CAAE" />
    </linearGradient>
    <linearGradient id="coatGradFem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadowFem" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.12" flood-color="#0E746D" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="32" fill="url(#bgGradFem)" />

  <!-- Subtle Medical Cross pattern in top-right -->
  <g opacity="0.35" transform="translate(196, 18)">
    <rect x="7" y="0" width="6" height="20" rx="3" fill="#26B09A" />
    <rect x="0" y="7" width="20" height="6" rx="3" fill="#26B09A" />
  </g>

  <!-- Female Doctor Figure -->
  <g id="female-doctor-figure">
    <!-- Hair back layer -->
    <path d="M72 90 C66 120 72 155 78 165 C84 150 82 110 82 90 Z" fill="#2B2D42" />
    <path d="M168 90 C174 120 168 155 162 165 C156 150 158 110 158 90 Z" fill="#2B2D42" />

    <!-- Inner Scrub / Shirt (Clinica Cure Soft Teal) -->
    <path d="M96 142 L144 142 L150 178 L90 178 Z" fill="#0E746D" />
    <!-- V-Neck scrub cut -->
    <path d="M106 142 L120 160 L134 142 Z" fill="#F0CAAE" />

    <!-- Shoulders & Doctor White Coat Body -->
    <path d="M44 240 C44 190 66 170 94 160 L104 240 Z" fill="url(#coatGradFem)" filter="url(#shadowFem)" />
    <path d="M196 240 C196 190 174 170 146 160 L136 240 Z" fill="url(#coatGradFem)" filter="url(#shadowFem)" />

    <!-- Center Coat Section -->
    <path d="M88 160 L120 240 L152 160 Z" fill="#F8FAFC" opacity="0.9" />

    <!-- Left Coat Lapel -->
    <path d="M94 152 L70 188 L104 240 L114 240 L102 182 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <!-- Right Coat Lapel -->
    <path d="M146 152 L170 188 L136 240 L126 240 L138 182 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />

    <!-- Stethoscope -->
    <path d="M98 148 C94 172 90 200 102 216 C108 224 116 224 118 214" fill="none" stroke="#334155" stroke-width="4.5" stroke-linecap="round" />
    <path d="M142 148 C146 172 150 196 138 214" fill="none" stroke="#334155" stroke-width="4.5" stroke-linecap="round" />
    <!-- Stethoscope Chestpiece -->
    <circle cx="102" cy="218" r="8" fill="#94A3B8" stroke="#334155" stroke-width="2" />
    <circle cx="102" cy="218" r="4.5" fill="#0E746D" />

    <!-- Neck -->
    <rect x="108" y="122" width="24" height="28" rx="6" fill="#F0CAAE" />
    <ellipse cx="120" cy="130" rx="10" ry="4" fill="#DEAB8B" opacity="0.35" />

    <!-- Ears & Pearls/Earrings -->
    <circle cx="83" cy="102" r="7" fill="#F0CAAE" />
    <circle cx="157" cy="102" r="7" fill="#F0CAAE" />
    <circle cx="83" cy="106" r="2.2" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="0.5" />
    <circle cx="157" cy="106" r="2.2" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="0.5" />

    <!-- Head / Face -->
    <ellipse cx="120" cy="100" rx="36" ry="42" fill="url(#skinGradFem)" />

    <!-- Professional Female Hairstyle (Neat side sweep & low bun/shoulder drape) -->
    <path d="M83 95 C80 62 92 46 120 46 C148 46 160 62 157 95 C153 74 140 62 120 62 C96 62 86 78 83 95 Z" fill="#2B2D42" />
    <path d="M83 80 C95 64 120 64 135 72 C115 68 95 72 84 84 Z" fill="#3D3E56" opacity="0.5" />

    <!-- Eyebrows (Neat, curved) -->
    <path d="M96 88 C102 85 108 86 112 88" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <path d="M128 88 C132 86 138 85 144 88" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Eyes (Warm, caring) -->
    <circle cx="104" cy="96" r="3" fill="#1E293B" />
    <circle cx="136" cy="96" r="3" fill="#1E293B" />
    <circle cx="105" cy="94.8" r="1" fill="#FFFFFF" />
    <circle cx="137" cy="94.8" r="1" fill="#FFFFFF" />

    <!-- Nose -->
    <path d="M120 96 L118 107 L122 107" fill="none" stroke="#DEAB8B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Friendly Smile with soft lip color -->
    <path d="M111 118 C115 123 125 123 129 118" fill="none" stroke="#C45A65" stroke-width="2.2" stroke-linecap="round" />

    <!-- Small ID Badge on coat -->
    <rect x="70" y="196" width="18" height="24" rx="3" fill="#FFFFFF" stroke="#0E746D" stroke-width="1.2" />
    <rect x="73" y="200" width="12" height="4" rx="1" fill="#0E746D" />
    <line x1="73" y1="208" x2="85" y2="208" stroke="#94A3B8" stroke-width="1" />
    <line x1="73" y1="212" x2="82" y2="212" stroke="#94A3B8" stroke-width="1" />
  </g>
</svg>
